<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Özel Web Sitesi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 640px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .icon { font-size: 50px; margin-bottom: 16px; }
        h1 { font-size: 28px; font-weight: 800; color: #38bdf8; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
        .highlight-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            color: #a5f3fc;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0b0f19;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.95; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✨</div>
        <h1>Hoş Geldiniz!</h1>
        <p>
            Bu sayfa <strong>ESP32 NodeMCU DevKit V1</strong>'in yerel Flash belleğinden çalışmaktadır. 
            Buraya kendi istediğiniz herhangi bir web sitesi HTML/CSS kodunu yerleştirebilirsiniz.
        </p>
        <div class="highlight-box">
            Adres: denemesitem.com (veya belirlediğiniz özel URL)
        </div>
        <a href="/admin" class="btn">⚙️ Yönetim Paneline Git (/admin)</a>
    </div>
</body>
</html>
